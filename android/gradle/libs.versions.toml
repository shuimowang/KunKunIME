[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.16.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
miuix = "0.9.3"
tomlj = "1.1.1"
recyclerview = "1.3.2"
jna = "5.19.1"
coroutines = "1.10.2"
junit = "4.13.2"
orgJson = "20240303"
customview = "1.1.0"
androidxTestRunner = "1.6.2"
