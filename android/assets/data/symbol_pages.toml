# 分类符号页的数据（123 层 / 数字键盘的「符号」键进入；docs/android-ime-features.md §14.3）
#
# 自行整理，不取自其它输入法的数据文件。
# 每个 [[category]]：
#   name     底部分类 tab 上的字
#   symbols  空白分隔的符号；一项可以是多个字符（如「……」「——」）
# 「最近」不在这里：它是点过的符号，由键盘自己记。
#
# 覆盖解析：filesDir/user/symbol_pages.toml > filesDir/data/symbol_pages.toml > 内置空表。

