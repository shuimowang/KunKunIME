# 安卓设置清单：驱动设置页生成（结构与取舍见 docs/mobile-ux-reference.md §6）。
#
# [[page]]   一级页面（首页的一行）
#   id       页面标识；schema / stats / dict / about 另有代码画的专属区块
#   title    标题
#   segment  首页分段：shared（输入引擎：与电脑版共用的引擎设置）/ android（手机键盘）/ tail（其他）
#   icon     首页图标名（见 SettingsIcons.kt；单测核对每个名字都能解析）
#   subpages true = 页内每个 section 是一个二级入口，点进去才是那一组设置；
#            false（缺省）= 页内各 section 直接分组列出（项少的页）
#
# [[item]]   设置项，按出现顺序归入 page → section（卡片）
#   page     所属页面 id
#   section  卡片名（subpages 页里是二级入口名）。共用项照抄电脑版清单（wind-setting/src/assets/settings_manifest.toml）
#   key      配置键（点分路径）
#   source   engine = 引擎配置（经核心 config_set 写进核心用户层，键须在核心注册表里）
#            android = 键盘自己的配置（filesDir/user/config.toml，只有 K 侧读）
#   type     toggle / select / int
#   title    标题。共用项照抄电脑版的 label；键盘专属项写看得见的行为
#   summary  说明（可选）
#   default  默认值（仅 android 项；引擎项的当前值与默认值都来自核心）
#   options  select 的选项 [{ value, label }]；value 一律写字符串，写入时按键的类型转换
#   min / max / step / unit   int 的范围、步长、单位
#   advanced true = 收进卡片底部的「进阶」折叠区（工程参数）
#   exclusive_with  另一个开关键：本项打开时把它关掉（二选一，照电脑版清单）
#   enabled_when    另一个开关键：它开着时本项才显示（电脑版写 "键 == true"，这里只写键）；
#            依赖链逐级生效：A 依赖 B、B 依赖 C，C 关着时 A、B 都不显示

#   card     二级页里再分卡片：同 section 内按 card 首次出现序各成一张带标题的卡（缺省 = 无标题的头一张）
#   hardware true = 只对实体键盘有意义的项（触发键、快捷键），「高级 → 显示实体键盘设置」打开才显示
#   grid     true = 这张卡画成两列勾选网格（只用于短标题的开关，如模糊音的拼音对）
#   preview  int 项拖动时的预览：keyboard_rows（按所选行高画四行键）/ candidate_text（按所选字号写一行候选）
#
# 引擎项写入后会发 ReloadConfig 让核心即时重读；键盘项在下次弹出键盘时生效。

