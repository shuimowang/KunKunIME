name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare a release draft after both device checks (main only; fixed-key signing remains separate)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Android change detection
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          def version_of(source):
              code = re.search(r'versionCode\s*=\s*(\d+)', source)
              name = re.search(r'versionName\s*=\s*"([^"]+)"', source)
              if code is None or name is None:
                  raise ValueError("Cannot identify Android version declarations")
              return code[1], name[1]

          base = os.environ["PR_BASE"] or os.environ["PUSH_BASE"]
          run = True
          release = os.environ.get("PREPARE_RELEASE") == "true"
          version_path = "android/app/build.gradle.kts"
          current_version = version_of(Path(version_path).read_text())
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and base and set(base) != {"0"}:
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"]
              ).decode().split("\0")
              run = any(p.startswith(("android/", "WindInput/", "licenses/")) or
                        p in {".github/workflows/android.yml", "scripts/collect-cargo-notices.py", "LICENSE", "ORIGINS.md"}
                        for p in paths)
              if version_path in paths:
                  previous = subprocess.check_output(["git", "show", f"{base}:{version_path}"], text=True)
                  release = version_of(previous) != current_version
          if run and not release and Path(f"releases/android-v{current_version[1]}.md").is_file():
              tag = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/tags/android-v{current_version[1]}"],
                  text=True, capture_output=True,
              )
              if tag.returncode and "(HTTP 404)" not in tag.stderr:
                  raise RuntimeError(tag.stderr)
              release = tag.returncode != 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"android={str(run).lower()}\n")
              output.write(f"release={str(release).lower()}\n")
          PY

  build:
    name: Android release APK, debug queue and release IME tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      # Both the Android binding and WindInput are from this exact checkout.
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;28.2.13676358

      - name: Resolve Android build tools before compiling native libraries
        run: |
          resolve_log=$(mktemp)
          trap 'rm -f "$resolve_log"' EXIT
          for attempt in 1 2 3; do
            if ./gradlew help --no-daemon 2>&1 | tee "$resolve_log"; then
              exit 0
            else
              resolve_status=$?
            fi
            # Maven Central can rate-limit a fresh runner before any app code
            # is compiled. Retry that response only, never accept a failed build.
            if [ "$attempt" -eq 3 ] || ! grep -Fq \
                'Received status code 429 from server: Too Many Requests' "$resolve_log"; then
              exit "$resolve_status"
            fi
            retry_delay=$((attempt * 20))
            echo "Maven Central returned HTTP 429; retrying Gradle dependency resolution in ${retry_delay}s."
            sleep "$retry_delay"
          done

      - name: Select the same Rust version as Windows
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default 1.100.0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Android Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: android/rust
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Assemble the shared Pinyin and English assets
        run: python3 scripts/prepare-assets.py

      - name: Test real Pinyin and English through the Rust mobile binding
        working-directory: android/rust
        env:
          KUNKUN_IME_TEST_DATA: ${{ github.workspace }}/android/app/src/main/assets/data
        run: cargo test --locked -p wind-android --lib --test key_flow -- --test-threads=1

      - name: Build arm64 and x86_64 native libraries and generate Kotlin bindings
        run: scripts/build-rust.sh release

      - name: Check native libraries and generated UniFFI bindings
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libwind_android.so
          test -s app/src/main/jniLibs/x86_64/libwind_android.so
          test -s app/src/main/java/uniffi/wind_android/wind_android.kt

      - name: Generate notices for the actual Rust dependencies
        run: scripts/gen-rust-licenses.sh

      - name: Archive the locked Android Rust dependency sources and notices
        run: |
          rustup component add rust-docs --toolchain 1.100.0
          python3 ../scripts/collect-cargo-notices.py \
            --manifest rust/Cargo.toml --package wind-android \
            --target aarch64-linux-android --target x86_64-linux-android \
            --output app/build/release-support/cargo-notices \
            --crate-sources app/build/release-support/Cargo-sources.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          support = Path("app/build/release-support")
          notices = support / "cargo-notices"
          with ZipFile(support / "Cargo-sources.zip", "a") as archive:
              for source in sorted(notices.rglob("*")):
                  if source.is_file():
                      archive.write(source, "notices/" + source.relative_to(notices).as_posix())
          PY

      - name: Build debug APKs for queue and view regression tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Test Kotlin and build non-debuggable release app plus matching instrumentation
        # The CI key is temporary. The tested release payload is re-signed with
        # the external fixed key after download; no private signing key enters CI.
        run: >-
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:assembleReleaseAndroidTest
          -PimeTestBuildType=release -PciReleaseSigning=true --no-daemon

      - name: Verify release identity, flags, ABI payloads and publication metadata
        run: |
          python3 scripts/verify-apks.py --variant debug
          python3 scripts/verify-apks.py --variant release \
            --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            --cargo-sources app/build/release-support/Cargo-sources.zip \
            --write-release-info app/build/release-support/release-info.json

      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Verify debug startup queue and actual release IME separately
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: |
            bash scripts/smoke-test.sh debug
            bash scripts/smoke-test.sh release

      - name: Upload device and JVM test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KunKunIME-Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/smoke-results/
            android/app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the verified ARM64 release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KunKunIME-Android-arm64-release
          path: android/app/build/outputs/apk/release/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the verified x86_64 release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KunKunIME-Android-x86_64-release
          path: android/app/build/outputs/apk/release/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified release metadata and locked Rust sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KunKunIME-Android-release-support
          path: |
            android/app/build/release-support/release-info.json
            android/app/build/release-support/Cargo-sources.zip
          if-no-files-found: error
          retention-days: 14

  release-draft:
    name: Prepare the checked Android release draft
    needs: [changes, build]
    if: >-
      needs.changes.outputs.release == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: prepare-android-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download this run's verified release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name KunKunIME-Android-release-support --dir release-support
      - name: Create an exact-source release draft awaiting the fixed-key APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --platform android --metadata release-support/release-info.json --draft-only
