name: Update Windows and Android download links

on:
  workflow_call:
    inputs:
      published_tag:
        description: Stable release tag that must be visible before refreshing the download links
        type: string
        required: true
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  sync:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease &&
        (startsWith(github.event.release.tag_name, 'android-v') || startsWith(github.event.release.tag_name, 'v'))) ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-download-links-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the synchronization script from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Refresh download links from published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name || inputs.published_tag }}
        shell: bash
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --apply)
          if [[ -n "$PUBLISHED_TAG" ]]; then
            [[ "$PUBLISHED_TAG" =~ ^(android-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 0
            args+=(--published-tag "$PUBLISHED_TAG")
          fi
          python3 scripts/sync-release-downloads.py "${args[@]}"
