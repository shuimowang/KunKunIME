name: Windows build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the workflow present on every PR so existing required checks do not
  # remain Pending when a commit only changes the Android application.
  changes:
    name: Windows change detection
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["PR_BASE"] or os.environ["PUSH_BASE"]
          run = True
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and base and set(base) != {"0"}:
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"]
              ).decode().split("\0")
              run = any(p and not p.startswith("android/") and
                        p != ".github/workflows/android.yml" for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"windows={str(run).lower()}\n")
          PY

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustc -V
      - name: Build the Windows application and both TSF components
        run: ./scripts/build-windows.ps1
      - name: Load the 64-bit and 32-bit COM components without registering
        run: ./scripts/test-tsf.ps1 -Package (Join-Path $PWD 'dist/困困输入法')

      - name: Test the local MCP protocol and management tools
        run: |
          python -X utf8 tests/windows/mcp_stdio.py "dist/困困输入法/KunKunIME.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          cargo test --locked --manifest-path WindInput/wind_input/Cargo.toml --profile dev-variant -p wind_service --bin KunKunIME mcp::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path WindInput/wind_input/Cargo.toml --profile dev-variant -p wind_service --bin KunKunIME register_ime::tests::default_ime_


      - name: Test Pinyin, direct English typing and completions
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          cargo test --locked --manifest-path WindInput/wind_input/Cargo.toml --profile dev-variant -p wind-coordinator --test kunkun_bilingual --test manual_completions
      - name: Archive the verified Windows bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KunKunIME-Windows-x64
          path: dist/困困输入法/
          if-no-files-found: error
          retention-days: 14

  settings:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select Rust
        run: rustup default 1.100.0
      - name: Test settings and the completion manager
        shell: pwsh
        run: |
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib autosave -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib completion_add -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib unified_window -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib completion_rules_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib mcp_guide_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path wind-setting/Cargo.toml --lib windows_default_ime_ -- --test-threads=1
