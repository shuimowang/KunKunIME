[schema]
active = "pinyin"
available = ["pinyin", "shuangpin", "english"]

[schema.pinyin]
sentence_count = 3
sentence_max_count = 6

[schema.pinyin.completion]
min_syllables = 2

[schema.pinyin.grammar]
enabled = true

[input.association]
kind = "smart"
mode = "continuous"
select_keys_commit = false
select_keys_as_punctuation = true
backspace_cancels_only = false

[keys]
select_key_groups = []

[keys.key_actions]
semicolon = "none"
"ctrl+shift+semicolon" = "rare_char"

[ui.toolbar]
items = ["mode", "-punct", "-full_width", "-s2t", "-t2s", "soft_keyboard", "settings"]
